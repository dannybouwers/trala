name: Dev Image Build

# Unprivileged build for pull request dev images. Builds a multi-arch OCI
# archive and uploads it as an artifact; the privileged Dev Image Publish
# workflow (via workflow_run) performs the push. No pull_request_target and no
# secrets here.
#
# Actions are pinned to commit SHAs (unlike the repo's other workflows, which
# use floating major tags) because these workflows hold `packages: write` and
# handle untrusted fork artifacts; SHA pinning keeps a compromised or retagged
# action from abusing that token.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Skip builds for non-application changes. Paths listed in .gitignore
    # (plans/, local/, .kilo/, .kilocode/, .vscode/) can never appear in a PR
    # diff, so they are intentionally not listed. Do NOT ignore
    # .github/workflows/** so workflow changes still produce a build.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'demo/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/renovate.json'

permissions:
  contents: read
  # Same-repo PRs only; fork runs get a read-only token and the auto-label step
  # is skipped by its `if` guard. The label endpoint is accepted with
  # `pull-requests: write` alone (and creates the label if it is missing).
  pull-requests: write

concurrency:
  group: dev-image-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Never build for bots (Renovate, Weblate, ...).
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev-pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: Capture build time
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image (multi-arch OCI archive)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/dev-image.tar
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev-pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.event.pull_request.head.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload dev image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-image
          path: /tmp/dev-image.tar
          retention-days: 1

      # Same-repo PRs publish automatically: add the label so the PR shows that a
      # dev image exists. Fork PRs are never auto-labeled — there the label is the
      # maintainer's explicit approval to publish. Best-effort: never fail the
      # build here, or the dependent publish workflow would be skipped.
      - name: Add dev-build label (same-repo only)
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            --input - <<< '{"labels":["dev-build"]}'
