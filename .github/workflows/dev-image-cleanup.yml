name: Dev Image Cleanup

# Deletes ghcr.io/<owner>/trala:dev-pr-<N> package versions:
#  - immediately when a same-repo PR closes, and
#  - nightly, for every dev tag whose PR is no longer open (covers fork PRs and
#    missed close events).
#
# If deletion fails with `403 resource not accessible by integration`, the
# package is not linked to the repo with admin rights for GITHUB_TOKEN; pass a
# PAT with `delete:packages` to the action's `token` input instead.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Collect dev image version IDs to delete
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          API="/users/$OWNER/packages/container/trala/versions?per_page=100"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fork PR tags are handled by the scheduled sweep below.
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "ids=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="dev-pr-${{ github.event.pull_request.number }}"
            IDS=$(gh api --paginate "$API" \
              --jq ".[] | select(any(.metadata.container.tags[]?; . == \"$TAG\")) | .id" \
              | paste -sd, -)
          else
            OPEN=$(gh api --paginate \
              "/repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '.[].number')
            IDS=$(gh api --paginate "$API" \
              --jq '.[] | "\(.id) \((.metadata.container.tags // []) | join(","))"' \
              | while read -r id tags; do
                  for t in ${tags//,/ }; do
                    case "$t" in
                      dev-pr-*) n="${t#dev-pr-}"; n="${n%%-*}"
                        if ! grep -qx "$n" <<<"$OPEN"; then echo "$id"; break; fi ;;
                    esac
                  done
                done | paste -sd, -)
          fi

          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Version IDs to delete: ${IDS:-<none>}"

      - name: Delete versions
        if: steps.collect.outputs.ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: trala
          package-type: container
          package-version-ids: ${{ steps.collect.outputs.ids }}
          token: ${{ secrets.GITHUB_TOKEN }}
