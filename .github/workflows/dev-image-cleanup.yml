name: Dev Image Cleanup

# Deletes ghcr.io/<owner>/trala:dev-pr-<N> package versions:
#  - immediately when a same-repo PR closes, and
#  - nightly, for every PR closed in the last 24h (covers fork PRs and missed
#    close events).
#
# A regex over the dev tags is handed to SmartsquareGmbH/delete-old-packages,
# which matches on image tags directly, so this workflow no longer enumerates
# package versions or parses their tags itself.
#
# Caveat: delete-old-packages only inspects the package's first 100 versions
# (no pagination), so if `trala` ever grows well past 100 versions, older dev
# tags may fall outside that window and be skipped.
#
# If deletion fails with `403 resource not accessible by integration`, the
# package is not linked to the repo with admin rights for GITHUB_TOKEN; pass a
# PAT with `delete:packages` to the action's `token` input instead.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Determine dev tag pattern
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fork PR close events run with a read-only token; the nightly sweep covers them.
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "pattern=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PATTERN="^dev-pr-${{ github.event.pull_request.number }}(-|$)"
          else
            # PRs closed since the previous nightly run. Re-running the delete for
            # an already-pruned tag is a no-op, so ambiguity at the edges is fine.
            SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            NUMS=$(gh api --paginate \
              "/repos/${{ github.repository }}/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
              --jq ".[] | select(.closed_at != null and .closed_at >= \"$SINCE\") | .number" \
              | paste -sd'|' -)
            if [ -z "$NUMS" ]; then
              echo "No PRs closed in the last 24h."
              echo "pattern=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PATTERN="^dev-pr-($NUMS)(-|$)"
          fi

          echo "pattern=$PATTERN" >> "$GITHUB_OUTPUT"
          echo "Dev tag pattern to delete: $PATTERN"

      - name: Delete dev image versions
        if: steps.collect.outputs.pattern != ''
        uses: SmartsquareGmbH/delete-old-packages@78421c4341be2a20cc4766902b4dc2925efa5117 # v1.0.0
        with:
          user: ${{ github.repository_owner }}
          type: container
          names: trala
          version-pattern: ${{ steps.collect.outputs.pattern }}
          keep: 0
          token: ${{ secrets.GITHUB_TOKEN }}
